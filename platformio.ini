[env:pico]
; STN capture: D0-D3 = GP0-GP3, XSCL = GP4, LP = GP8, YD = GP9 (PIO1).
; VGA output: HSYNC = GP16, VSYNC = GP17, video = GP18 (PIO0).
; VGA uses two PIO0 state machines: hardware HSYNC and synchronized video.
; VGA line IRQ priority is 0x40; capture GPIO IRQ uses 0x80.
; All three DMA channels and three PIO state machines are claimed through the SDK.
; Main snapshots capture briefly, then renders 320x240 at 400x300 using a nibble LUT.
; VGA shows only captured pixels; allocation/resource/DMA errors go to serial/panic.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
